name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: schedra
          POSTGRES_PASSWORD: schedra
          POSTGRES_DB: schedra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schedra -d schedra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://schedra:schedra@localhost:5432/schedra_test
      DIRECT_URL: postgres://schedra:schedra@localhost:5432/schedra_test
      TEST_DATABASE_URL: postgres://schedra:schedra@localhost:5432/schedra_test
      SCHEDRA_URL: http://localhost:3002
      AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
