# Port 5442 rather than 5432 so this never fights another Postgres on the host.
services:
  app:
    build: .
    container_name: schedra-app
    restart: unless-stopped
    command: ['sh', '-c', 'node scripts/migrate.mjs && node .output/server/index.mjs']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://schedra:schedra@db:5432/schedra
      SCHEDRA_URL: http://localhost:3002
      AUTH_SECRET: local-compose-secret-change-before-production
      PORT: 3000
    ports:
      - '3002:3000'

  db:
    image: postgres:18-alpine
    container_name: schedra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: schedra
      POSTGRES_PASSWORD: schedra
      POSTGRES_DB: schedra
    ports:
      - '5442:5432'
    volumes:
      # Postgres 18+ wants the mount one level up, at /var/lib/postgresql, and
      # keeps data in a major-version subdirectory so pg_upgrade can work.
      - schedra-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schedra -d schedra']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  schedra-data:
