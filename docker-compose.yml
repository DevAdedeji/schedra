# Port 5442 rather than 5432 so this never fights another Postgres on the host.
services:
  db:
    image: postgres:18-alpine
    container_name: schedra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: schedra
      POSTGRES_PASSWORD: schedra
      POSTGRES_DB: schedra
    ports:
      - '5442:5432'
    volumes:
      # Postgres 18+ wants the mount one level up, at /var/lib/postgresql, and
      # keeps data in a major-version subdirectory so pg_upgrade can work.
      - schedra-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schedra -d schedra']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  schedra-data:
